services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jakdang
      POSTGRES_PASSWORD: jakdang
      POSTGRES_DB: jakdang_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - jakdang-pg:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jakdang -d jakdang_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  jakdang-pg:
